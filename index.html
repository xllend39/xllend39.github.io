<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語發音點讀機 (內地直連版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        
        /* 視覺顯示區 (取代黑畫面) */
        .visual-container {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            border-radius: 12px; padding: 40px 20px; text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin: 20px auto; max-width: 480px;
            color: white; font-size: 48px; font-weight: bold; letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2); transition: all 0.3s;
        }
        
        .category-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .category-title { border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 15px; color: #34495e; font-size: 20px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        
        .word-btn {
            background-color: #f1f3f5; border: 2px solid #dee2e6; border-radius: 8px;
            padding: 12px; text-align: left; cursor: pointer; transition: all 0.2s ease;
        }
        .word-btn:hover { background-color: #e2e6ea; border-color: #0056b3; transform: translateY(-2px); }
        .word-title { font-size: 18px; font-weight: bold; color: #0056b3; margin-bottom: 4px; }
        .word-ipa { font-size: 14px; color: #6c757d; font-family: 'Courier New', Courier, monospace; }
        
        .type-badge { display: inline-block; font-size: 11px; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; margin-left: 5px; color: #555;}
    </style>
</head>
<body>

    <h1>👄 英語發音點讀機</h1>
    
    <div class="visual-container" id="visual-word">
        點擊下方單字
    </div>

    <audio id="youdao-audio" src=""></audio>

    <div class="category-section">
        <div class="category-title">模塊一：基礎音標與自然拼讀</div>
        <div class="grid-container">
            <button class="word-btn" onclick="playVoice('cat', 2, '/æ/')">
                <div class="word-title">Cat <span class="type-badge">美音</span></div>
                <div class="word-ipa">/æ/ 短母音</div>
            </button>
            <button class="word-btn" onclick="playVoice('cat', 1, '/æ/')">
                <div class="word-title">Cat <span class="type-badge">英音</span></div>
                <div class="word-ipa">/æ/ 短母音</div>
            </button>
            <button class="word-btn" onclick="playVoice('make', 2, '/eɪ/')">
                <div class="word-title">Make</div>
                <div class="word-ipa">/eɪ/ 長母音</div>
            </button>
        </div>
    </div>

    <div class="category-section">
        <div class="category-title">模塊二：核心詞根詞綴</div>
        <div class="grid-container">
            <button class="word-btn" onclick="playVoice('create', 2, '/eɪt/')">
                <div class="word-title">Create</div>
                <div class="word-ipa">-ate 動詞後綴 /eɪt/</div>
            </button>
            <button class="word-btn" onclick="playVoice('considerate', 2, '/ət/')">
                <div class="word-title">Considerate</div>
                <div class="word-ipa">-ate 形容詞後綴 /ət/</div>
            </button>
            <button class="word-btn" onclick="playVoice('tradition', 2, '/ʃn/')">
                <div class="word-title">Tradition</div>
                <div class="word-ipa">-tion 後綴 /ʃn/</div>
            </button>
            <button class="word-btn" onclick="playVoice('consider', 2, '/ə/')">
                <div class="word-title">Consider</div>
                <div class="word-ipa">con- 弱化音 /ə/</div>
            </button>
            <button class="word-btn" onclick="playVoice('concentrate', 2, '/ɒ/')">
                <div class="word-title">Concentrate</div>
                <div class="word-ipa">con- 重讀音 /ɒ/</div>
            </button>
        </div>
    </div>

    <script>
        // 調用有道詞典 API 發音
        function playVoice(word, type, ipa) {
            // 更新視覺區塊的文字，增加互動感
            const visualBox = document.getElementById('visual-word');
            visualBox.innerHTML = `${word}<br><span style="font-size:24px;">${ipa}</span>`;
            
            // 組合有道 API 網址 (type 1: 英音, type 2: 美音)
            const audioUrl = `https://dict.youdao.com/dictvoice?audio=${word}&type=${type}`;
            
            // 播放聲音
            const player = document.getElementById('youdao-audio');
            player.src = audioUrl;
            player.play().catch(e => alert("發音讀取失敗，請檢查網路連線。"));
        }
    </script>

</body>
</html>
