<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KongU 錄取案例 - Prototype</title>
  <style>
    :root{
      --bg:#f8f4fb;
      --ink:#121426;
      --muted:#8f8b99;
      --purple:#8b5cf6;
      --purple2:#6f6dfb;
      --blue:#5a87ff;
      --red:#ff3d61;
      --pink:#fff0f4;
      --card:#ffffff;
      --line:#f0ebf6;
      --shadow:0 12px 30px rgba(82,62,140,.12);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f7efff 0%,#fff7f3 45%,#f8f4fb 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
    .phone{width:447px;max-width:100%;min-height:100vh;margin:0 auto;background:linear-gradient(180deg,#faf4ff 0%,#fff 30%,#f8f4fb 100%);position:relative;overflow:hidden;padding-bottom:96px;}
    .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 42px;font-weight:800;color:#0b1020}
    .island{position:absolute;left:50%;transform:translateX(-50%);top:16px;width:118px;height:32px;border-radius:999px;background:#000}
    .icons{display:flex;gap:6px;align-items:center;font-size:13px}
    .nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;}
    .brand{display:flex;align-items:flex-end;gap:12px}
    .brand b{font-size:25px;letter-spacing:-.02em}
    .brand span{font-size:13px;color:#25223a;transform:translateY(-3px)}
    .more{height:34px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 8px 18px rgba(66,51,105,.1);display:flex;align-items:center;gap:14px;padding:0 14px;font-size:19px}
    .hero{margin:18px 19px 22px;border-radius:22px;padding:22px 18px 19px;background:radial-gradient(circle at 78% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 34%),linear-gradient(135deg,#f5eaff,#fff1f1);box-shadow:var(--shadow);position:relative;overflow:hidden;}
    .hero:after{content:"";position:absolute;right:-34px;top:18px;width:150px;height:150px;background:linear-gradient(135deg,#9b7cff,#4e83ff);border-radius:42% 58% 48% 52%;opacity:.16;}
    .hero h1{font-size:28px;line-height:1.12;margin:0 120px 8px 0;font-weight:950;letter-spacing:-.02em;}
    .hero .sub{color:#8c6cff;font-weight:700;margin-bottom:14px;font-size:14px}
    .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;width:230px;position:relative;z-index:1}
    .check{font-size:13px;color:#54506a;display:flex;gap:6px;align-items:center;white-space:nowrap}
    .check i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:#efe8ff;color:var(--purple);font-style:normal;font-size:11px;font-weight:900}
    .boy{position:absolute;right:18px;top:48px;width:112px;height:152px;z-index:2}
    .boy .head{width:52px;height:52px;background:#ffd4af;border-radius:50%;margin:0 auto;position:relative}
    .boy .hair{position:absolute;left:5px;top:-3px;width:43px;height:19px;background:#17223c;border-radius:20px 20px 8px 8px;transform:rotate(-5deg)}
    .boy .glass{position:absolute;left:8px;top:22px;width:36px;height:12px;border:3px solid #56a4ff;border-radius:8px}
    .boy .body{width:82px;height:92px;border-radius:34px 34px 18px 18px;background:linear-gradient(180deg,#bfe9ff,#68a5ff);margin:-1px auto 0;box-shadow:inset 0 -16px 0 rgba(255,255,255,.22)}
    .btn-main{margin-top:22px;height:64px;border-radius:16px;background:linear-gradient(135deg,#9d72ff,#5b82ff);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 12px 24px rgba(111,109,251,.24);font-weight:900;font-size:18px}
    .btn-main small{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.9}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 19px 26px}
    .quick-card{height:98px;border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:20px 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.8)}
    .quick-card:nth-child(1){background:linear-gradient(135deg,#eef4ff,#fff2fb)}
    .quick-card:nth-child(2){background:linear-gradient(135deg,#fff1e9,#fff8ef)}
    .quick h3{margin:0 0 5px;font-size:17px}
    .quick p{margin:0;color:#8e8797;font-size:12px}
    .bubble{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:0 8px 18px rgba(106,83,180,.14)}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin:0 19px 12px}
    .title-row h2{margin:0;font-size:20px;letter-spacing:-.01em}
    .title-row a{font-size:13px;color:#9b96a5;text-decoration:none}
    .case-window{margin:0 19px 24px;background:linear-gradient(135deg,#f0e9ff,#fff1ed);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;padding:20px 18px 11px;text-decoration:none;color:inherit;display:block;}
    .case-window:hover{transform:translateY(-1px)}
    .thumb{position:absolute;right:32px;top:0;font-size:70px;opacity:.1;transform:rotate(-10deg)}
    .ribbon{position:absolute;right:0;top:0;width:55px;height:68px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:18px;letter-spacing:.04em}
    .ribbon:after{content:"";position:absolute;bottom:-13px;left:0;width:0;height:0;border-left:27.5px solid transparent;border-right:27.5px solid transparent;border-top:13px solid var(--red)}
    .case-title{position:relative;z-index:1;margin:0 60px 8px 0;font-size:18px;line-height:1.25;font-weight:900;color:#36334d}
    .case-title em{font-style:normal;color:#7d4dff}
    .case-sub{position:relative;z-index:1;margin:0 60px 16px 0;color:#8f8b99;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .case-card{background:#fff;border-radius:10px;min-height:96px;display:flex;align-items:center;gap:15px;padding:15px 17px;position:relative;z-index:1;box-shadow:0 4px 16px rgba(99,78,155,.07)}
    .logo{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff 38%,#eaf5ff 39%);border:2px solid #80a4e9;display:grid;place-items:center;color:#4d6dcf;font-weight:950;font-size:19px;flex:0 0 auto}
    .school{margin:0 0 8px;font-weight:900;font-size:14px;line-height:1.25}
    .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .pill{font-size:11px;font-weight:800;border-radius:5px;padding:4px 6px;color:#8b72ff;background:#f0ebff}
    .pill.red{color:#ff5b6f;background:#fff0f2}
    .date{font-size:12px;color:#9b96a5}
    .dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
    .dot{width:6px;height:6px;border-radius:50%;background:#e2dcef}.dot.active{background:#8b5cf6}
    .consult{margin:0 19px 26px;height:54px;border-radius:14px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;gap:10px;color:#6f6878;font-size:13px}
    .consult b{color:#8b5cf6;font-size:17px;line-height:.95}.consult .tag{background:#8b5cf6;color:#fff;padding:3px 8px;border-radius:6px;font-weight:900}
    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:447px;max-width:100%;height:74px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid #f0edf6;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:20}
    .tab{text-align:center;color:#6f7487;font-size:11px;text-decoration:none}.tab i{display:block;font-size:23px;margin-bottom:3px}.tab.active{color:#8b5cf6;font-weight:900}
    .float{position:absolute;right:18px;top:790px;border-radius:22px;background:#fff;box-shadow:0 10px 24px rgba(79,65,120,.15);padding:7px 10px;text-align:center;font-size:12px;color:#5b5366;font-weight:800;z-index:5}
    .float:before{content:"•••";display:block;margin:0 auto 2px;width:32px;height:22px;border-radius:999px;background:#8e72ff;color:#fff;line-height:13px;font-size:22px}
    @media(max-width:460px){.phone{width:100%}.bottom{width:100%}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><div class="island"></div><span class="icons">▮▮▮  Wi‑Fi  ▰</span></div>
    <div class="nav"><div class="brand"><b>KongU</b><span>小一在讀 ▾</span></div><div class="more">••• ◎</div></div>
    <section class="hero">
      <h1>港校智能測評助手</h1>
      <div class="sub">9000+ 真實升學案例 · 28 年升學服務經驗</div>
      <div class="checks">
        <span class="check"><i>✓</i>科學測評</span><span class="check"><i>✓</i>專業分析</span>
        <span class="check"><i>✓</i>擇校建議</span><span class="check"><i>✓</i>學習規劃</span>
      </div>
      <div class="boy" aria-hidden="true"><div class="head"><div class="hair"></div><div class="glass"></div></div><div class="body"></div></div>
      <div class="btn-main">開始測評<small>20分鐘幫你訂製專屬擇校報告</small></div>
    </section>
    <section class="quick">
      <div class="quick-card"><div><h3>學校庫 ›</h3><p>學校一鍵查詢</p></div><div class="bubble">🎓</div></div>
      <div class="quick-card"><div><h3>擇校指南 ›</h3><p>了解香港擇校</p></div><div class="bubble">📚</div></div>
    </section>
    <div class="title-row"><h2>錄取案例</h2></div>
    <a class="case-window" href="kongu_case_profile.html" aria-label="查看 N同學錄取案例詳情">
      <div class="thumb">👍</div><div class="ribbon">喜報</div>
      <h3 class="case-title">N同學 測評提升：Band 2C → <em>Band 1A</em></h3>
      <p class="case-sub">升中四 哈爾濱外國語學校</p>
      <div class="case-card">
        <div class="logo">協</div>
        <div><p class="school">協恩中學</p><div class="meta"><span class="pill red">中四插班成功</span><span class="pill">筆試</span><span class="pill">面試</span></div><div class="date">申請/錄取時間：2025.06–2025.07</div></div>
      </div>
      <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    </a>
    <div class="consult"><b>免費<br>咨詢</b><span class="tag">1v1</span><span>名優教育團隊幫你訂製各種升學服務</span><span style="margin-left:auto;color:#aaa">›</span></div>
    <div class="float">人工咨詢</div>
    <nav class="bottom"><a class="tab active" href="#"><i>⌂</i>首頁</a><a class="tab" href="#"><i>▣</i>擇校</a><a class="tab" href="#"><i>▱</i>測評</a><a class="tab" href="#"><i>☻</i>我的</a></nav>
  </main>
</body>
</html>
