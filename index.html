<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語發音點讀機 (離線版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        
        /* 影片播放器樣式 */
        .video-container {
            background-color: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); margin: 20px auto; max-width: 480px;
        }
        video { width: 100%; height: auto; display: block; }
        
        /* 分類區塊樣式 */
        .category-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .category-title { border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 15px; color: #34495e; font-size: 20px; font-weight: bold; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        
        /* 單字按鈕樣式 */
        .word-btn {
            background-color: #f1f3f5; border: 2px solid #dee2e6; border-radius: 8px;
            padding: 12px; text-align: left; cursor: pointer; transition: all 0.2s ease;
        }
        .word-btn:hover { background-color: #e2e6ea; border-color: #adb5bd; transform: translateY(-2px); }
        .word-title { font-size: 18px; font-weight: bold; color: #0056b3; margin-bottom: 4px; }
        .word-ipa { font-size: 14px; color: #6c757d; font-family: 'Courier New', Courier, monospace; }
        
        /* 目前播放狀態提示 */
        #now-playing { text-align: center; font-size: 18px; font-weight: bold; color: #e74c3c; margin: 15px 0; min-height: 27px; }
    </style>
</head>
<body>

    <h1>👄 英語發音點讀機</h1>
    <div id="now-playing">請選擇下方單字觀看口型影片</div>

    <div class="video-container">
        <video id="local-player" playsinline>
            你的瀏覽器不支援 HTML5 影片。
        </video>
    </div>

    <div class="category-section">
        <div class="category-title">模塊一：基礎音標與自然拼讀</div>
        <div class="grid-container">
            <button class="word-btn" onclick="playLocalVideo('videos/cat.mp4', 'Cat /æ/')">
                <div class="word-title">Cat</div>
                <div class="word-ipa">/æ/ 短母音</div>
            </button>
            <button class="word-btn" onclick="playLocalVideo('videos/make.mp4', 'Make /eɪ/')">
                <div class="word-title">Make</div>
                <div class="word-ipa">/eɪ/ 長母音</div>
            </button>
        </div>
    </div>

    <div class="category-section">
        <div class="category-title">模塊二：核心詞根詞綴</div>
        <div class="grid-container">
            <button class="word-btn" onclick="playLocalVideo('videos/create.mp4', 'Create /eɪt/')">
                <div class="word-title">Create</div>
                <div class="word-ipa">-ate 動詞後綴 /eɪt/</div>
            </button>
            <button class="word-btn" onclick="playLocalVideo('videos/considerate.mp4', 'Considerate /ət/')">
                <div class="word-title">Considerate</div>
                <div class="word-ipa">-ate 形容詞後綴 /ət/</div>
            </button>
