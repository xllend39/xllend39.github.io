
<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語發音影片點讀機 2.0</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; text-align: center; padding: 20px; }
        .video-container {
            margin: 20px auto; max-width: 560px; border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-color: #000;
        }
        iframe { width: 100%; height: 315px; border: none; }
        
        /* 單字卡片列表樣式 */
        .word-list { display: flex; flex-direction: column; gap: 15px; max-width: 560px; margin: 0 auto; }
        .word-card {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        /* 點擊單字的互動樣式 */
        .word-text {
            font-size: 24px; font-weight: bold; color: #2c3e50; cursor: pointer;
            transition: color 0.2s; display: flex; align-items: center; gap: 10px;
            user-select: none;
        }
        .word-text:hover { color: #3498db; }
        .word-text:active { transform: scale(0.95); }
        .phonetic { font-size: 16px; color: #7f8c8d; font-weight: normal; }
        
        /* 影片按鈕樣式 */
        button {
            background-color: #e74c3c; color: white; border: none; padding: 10px 15px;
            font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        button:hover { background-color: #c0392b; }
        .tip { color: #e67e22; font-size: 16px; margin-bottom: 20px; font-weight: bold;}
    </style>
</head>
<body>

    <h1>📺 英語口型影片點讀機 2.0</h1>
    <p class="tip">💡 點擊「英文單字」可直接聽發音，點擊「觀看口型」可看真人影片</p>

    <div class="video-container">
        <iframe id="yt-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="word-list">
        <div class="word-card">
            <div class="word-text" onclick="speakWord('cat', 'en-US')">
                🔊 Cat <span class="phonetic">/æ/ (美音)</span>
            </div>
            <button onclick="playVideo('KRzEZiXW4CA', 0, 5)">🎥 觀看口型</button>
        </div>

        <div class="word-card">
            <div class="word-text" onclick="speakWord('cat', 'en-GB')">
                🔊 Cat <span class="phonetic">/æ/ (英音)</span>
            </div>
            <button onclick="playVideo('IctwlBDPy-Y', 0, 5)">🎥 觀看口型</button>
        </div>

        <div class="word-card">
            <div class="word-text" onclick="speakWord('create', 'en-US')">
                🔊 Create <span class="phonetic">/eɪt/</span>
            </div>
            <button onclick="playVideo('_kVi2rD2HZ8', 0, 6)">🎥 觀看口型</button>
        </div>
    </div>

    <script>
        // 功能 1：點擊單字，使用瀏覽器內建 AI 語音引擎直接發音
        function speakWord(text, lang) {
            // 取消目前正在唸的聲音（防止連點重疊）
            window.speechSynthesis.cancel(); 
            
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; // 設定口音：'en-US' 美音, 'en-GB' 英音
            utterance.rate = 0.8;  // 語速設定為 0.8 倍，讓學生聽得更清楚
            
            window.speechSynthesis.speak(utterance);
        }

        // 功能 2：點擊按鈕，載入 YouTube 影片並精準跳轉秒數
        function playVideo(videoId, start, end) {
            // 加入 autoplay=1 自動播放
            let embedUrl = `https://www.youtube.com/embed/${videoId}?start=${start}&end=${end}&autoplay=1`;
            document.getElementById('yt-player').src = embedUrl;
        }
    </script>

</body>
</html>
